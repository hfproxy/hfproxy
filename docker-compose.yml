name: hfproxy-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hfproxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hfproxy_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-hfproxy}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.5.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:-GK0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET:-hfproxy}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  hfproxy:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HFPROXY_LISTEN_ADDR: 0.0.0.0:8080
      HFPROXY_PUBLIC_URL: ${HFPROXY_PUBLIC_URL:-http://localhost:8080}
      HFPROXY_LOG_LEVEL: info
      HFPROXY_DATABASE_URL: postgres://${POSTGRES_USER:-hfproxy}:${POSTGRES_PASSWORD:-hfproxy_dev_password}@postgres:5432/${POSTGRES_DB:-hfproxy}?sslmode=disable
      HFPROXY_AUTO_MIGRATE: "true"
      HFPROXY_HF_BASE_URL: https://huggingface.co
      HFPROXY_HF_PROXY_URL: ${HFPROXY_HF_PROXY_URL:-}
      HFPROXY_HF_TOKEN_FILE: ${HFPROXY_HF_TOKEN_FILE:-}
      HFPROXY_HF_TOKEN: ${HFPROXY_HF_TOKEN:-}
      HFPROXY_S3_ENDPOINT: http://garage:3900
      HFPROXY_S3_REGION: garage
      HFPROXY_S3_BUCKET: ${GARAGE_DEFAULT_BUCKET:-hfproxy}
      HFPROXY_S3_PREFIX: hfproxy
      HFPROXY_S3_FORCE_PATH_STYLE: "true"
      HFPROXY_S3_SERVER_SIDE_ENCRYPTION: "false"
      HFPROXY_S3_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:-GK0123456789abcdef0123456789abcdef}
      HFPROXY_S3_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      HFPROXY_AUTH_MODE: local
      HFPROXY_ANONYMOUS_PUBLIC_READ: ${HFPROXY_ANONYMOUS_PUBLIC_READ:-true}
      HFPROXY_SESSION_SECRET: ${HFPROXY_SESSION_SECRET:-dev-only-session-secret-change-before-deployment-32-bytes}
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  garage-meta:
  garage-data:
