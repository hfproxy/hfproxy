# Exemple d’exploitation derrière un reverse proxy TLS.
# Les valeurs marquées comme obligatoires sont injectées depuis l’orchestrateur ou un secret manager.
services:
  hfproxy:
    image: ghcr.io/your-org/hfproxy:v0.0.3
    environment:
      HFPROXY_LISTEN_ADDR: 0.0.0.0:8080
      HFPROXY_PUBLIC_URL: ${HFPROXY_PUBLIC_URL:?Set the public HTTPS URL}
      HFPROXY_TRUSTED_PROXIES: ${HFPROXY_TRUSTED_PROXIES:-}
      HFPROXY_DATABASE_URL_FILE: /run/secrets/database_url
      HFPROXY_AUTO_MIGRATE: "false"
      HFPROXY_HF_BASE_URL: https://huggingface.co
      HFPROXY_HF_PROXY_URL: ${HFPROXY_HF_PROXY_URL:-}
      HFPROXY_HF_TOKEN_FILE: /run/secrets/hf_token
      HFPROXY_HF_ALLOWED_REDIRECT_HOSTS: ${HFPROXY_HF_ALLOWED_REDIRECT_HOSTS:-huggingface.co,hf.co,*.huggingface.co,*.hf.co,*.xethub.hf.co}
      HFPROXY_S3_ENDPOINT: ${HFPROXY_S3_ENDPOINT:?Set the S3 endpoint}
      HFPROXY_S3_REGION: ${HFPROXY_S3_REGION:?Set the S3 region}
      HFPROXY_S3_BUCKET: ${HFPROXY_S3_BUCKET:?Set a private S3 bucket}
      HFPROXY_S3_PREFIX: hfproxy
      HFPROXY_S3_FORCE_PATH_STYLE: ${HFPROXY_S3_FORCE_PATH_STYLE:-false}
      HFPROXY_S3_SERVER_SIDE_ENCRYPTION: ${HFPROXY_S3_SERVER_SIDE_ENCRYPTION:-true}
      HFPROXY_S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      HFPROXY_S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      HFPROXY_AUTH_MODE: oidc
      HFPROXY_SESSION_SECRET_FILE: /run/secrets/session_secret
      HFPROXY_OIDC_ISSUER: ${HFPROXY_OIDC_ISSUER:?Set the OIDC issuer}
      HFPROXY_OIDC_CLIENT_ID: ${HFPROXY_OIDC_CLIENT_ID:?Set the OIDC client ID}
      HFPROXY_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      HFPROXY_OIDC_REDIRECT_URL: ${HFPROXY_OIDC_REDIRECT_URL:?Set the HTTPS callback URL}
      HFPROXY_ANONYMOUS_PUBLIC_READ: "false"
    secrets:
      - database_url
      - hf_token
      - s3_access_key
      - s3_secret_key
      - session_secret
      - oidc_client_secret
    expose:
      - "8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  database_url:
    file: ./secrets/database_url
  hf_token:
    file: ./secrets/hf_token
  s3_access_key:
    file: ./secrets/s3_access_key
  s3_secret_key:
    file: ./secrets/s3_secret_key
  session_secret:
    file: ./secrets/session_secret
  oidc_client_secret:
    file: ./secrets/oidc_client_secret
